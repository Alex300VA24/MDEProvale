
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="100%" height="100%">

    <defs>
      <!-- Fondo degradado -->
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0EA5E9"/>
        <stop offset="100%" stop-color="#0F766E"/>
      </linearGradient>

      <!-- Degradado piel -->
      <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FCD7B6"/>
        <stop offset="100%" stop-color="#F4BFA1"/>
      </linearGradient>

      <!-- Degradado vaso -->
      <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.95"/>
      </linearGradient>

      <!-- Sombra -->
      <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
      </filter>
    </defs>

    <!-- Fondo -->
    <circle cx="210" cy="210" r="190" fill="url(#bg)"/>
    <circle cx="210" cy="210" r="190" fill="none" stroke="#083344" stroke-width="10" opacity="0.25"/>

    <!-- Ícono Niño -->
    <g filter="url(#shadow)">

      <!-- Cabeza -->
      <circle cx="180" cy="170" r="55" fill="url(#skin)"/>

      <!-- Cabello -->
      <path d="M130 165
               C135 120, 170 105, 205 115
               C235 125, 245 150, 235 180
               C220 160, 190 155, 170 160
               C150 165, 140 170, 130 165 Z"
            fill="#1E293B"/>

      <!-- Oreja -->
      <circle cx="125" cy="180" r="12" fill="url(#skin)" opacity="0.95"/>

      <!-- Ojo -->
      <circle cx="165" cy="175" r="6" fill="#0F172A"/>

      <circle cx="200" cy="175" r="6" fill="#0F172A"/>

      <!-- Sonrisa -->
      <path d="M160 205
               Q180 220 200 205"
            stroke="#B45309" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>

      <!-- Cuerpo -->
      <path d="M120 265
               C130 230, 170 220, 200 230
               C230 240, 250 260, 255 295
               L255 320
               Q190 350 120 320
               Z"
            fill="#F8FAFC"/>

      <!-- Detalle camiseta -->
      <path d="M145 245
               Q180 270 215 245"
            stroke="#0EA5E9" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9"/>

      <!-- Brazo levantado -->
      <path d="M220 245
               C250 240, 270 255, 275 280
               C278 295, 268 310, 255 305
               C245 300, 245 285, 250 275
               C255 260, 240 252, 220 255 Z"
            fill="url(#skin)"/>

      <!-- Vaso -->
      <path d="M255 230
               L315 230
               L305 315
               Q285 330 265 315
               Z"
            fill="url(#glass)"/>

      <!-- Leche dentro -->
      <path d="M265 250
               Q285 265 300 252
               Q310 245 312 265
               L305 310
               Q285 322 270 310
               Z"
            fill="#E0F2FE"/>

      <!-- Brillo del vaso -->
      <path d="M270 245 L278 305"
            stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.3"/>

      <!-- Mano sujetando vaso -->
      <circle cx="260" cy="275" r="18" fill="url(#skin)"/>

    </g>

    <!-- Texto logo -->
    <text x="210" y="365" text-anchor="middle"
          font-family="Poppins, Arial, sans-serif"
          font-size="26"
          font-weight="800"
          fill="#F8FAFC"
          letter-spacing="1">
      VASO DE LECHE
    </text>

    <text x="210" y="392" text-anchor="middle"
          font-family="Poppins, Arial, sans-serif"
          font-size="14"
          font-weight="600"
          fill="#CCFBF1"
          letter-spacing="3">
      PROGRAMA SOCIAL
    </text>

  </svg>